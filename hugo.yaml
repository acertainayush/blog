baseURL: "http://www.slightlyconfused.org/"
title: "acertainayush"
languageCode: "en-us"
theme: "PaperMod"

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["\\[", "\\]"]
            - ["$$", "$$"]
          inline:
            - ["\\(", "\\)"]
params:
  math: true
  hidefooter: true
  mainSections: ["posts"]

  profileMode:
    enabled: true 
    imageUrl: "/pfp.png" # optional
    imageTitle: "<profile photo>" # optional
    imageWidth: 120 # custom size
    imageHeight: 120 # custom size
    buttons:
      - name: Posts
        url: "posts/"
  socialIcons: # optional
    - name: "Instagram"
      url: "https://www.instagram.com/therealministryofayush/"